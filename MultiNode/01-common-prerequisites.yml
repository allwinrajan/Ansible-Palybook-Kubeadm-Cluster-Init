---
- name: Common Kubernetes Prerequisites for All Nodes
  hosts: cluster
  become: yes
  gather_facts: yes

  tasks:
    # ============================================================
    # STEP 0: Force Kill APT Processes and Remove Locks
    # ============================================================
    - name: Force kill all apt/dpkg processes
      shell: |
        killall -9 apt-get apt dpkg unattended-upgrade 2>/dev/null || true
        sleep 2
      changed_when: false
      ignore_errors: yes

    - name: Remove all apt locks
      shell: |
        rm -f /var/lib/apt/lists/lock
        rm -f /var/cache/apt/archives/lock
        rm -f /var/lib/dpkg/lock*
        sleep 1
      changed_when: false
      ignore_errors: yes

    - name: Reconfigure dpkg
      command: dpkg --configure -a
      ignore_errors: yes
      changed_when: false

    # ============================================================
    # STEP 1: Disable Swap (Kubernetes Requirement)
    # ============================================================
    - name: Disable swap immediately
      shell: swapoff -a
      
    - name: Remove swap entry from /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '#\1'

    - name: Verify swap is disabled
      shell: free -h | grep -i swap
      register: swap_status
      changed_when: false

    - name: Display swap status
      debug:
        msg: "{{ swap_status.stdout_lines }}"

    # ============================================================
    # STEP 2: Load Kernel Modules for Container Networking
    # ============================================================
    - name: Load kernel modules for Kubernetes
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Load overlay module
      modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter module
      modprobe:
        name: br_netfilter
        state: present

    - name: Verify kernel modules are loaded
      shell: lsmod | grep -E 'overlay|br_netfilter'
      register: modules_status
      changed_when: false

    - name: Display loaded modules
      debug:
        msg: "{{ modules_status.stdout_lines }}"

    # ============================================================
    # STEP 3: Configure Network Parameters
    # ============================================================
    - name: Configure sysctl parameters for Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply sysctl parameters
      command: sysctl --system

    - name: Verify sysctl parameters
      shell: |
        sysctl net.bridge.bridge-nf-call-iptables
        sysctl net.bridge.bridge-nf-call-ip6tables
        sysctl net.ipv4.ip_forward
      register: sysctl_status
      changed_when: false

    - name: Display sysctl parameters
      debug:
        msg: "{{ sysctl_status.stdout_lines }}"

    # ============================================================
    # STEP 4: Install containerd (Container Runtime)
    # ============================================================
    - name: Check if containerd is already installed
      stat:
        path: /usr/local/bin/containerd
      register: containerd_installed

    - name: Download containerd
      get_url:
        url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-amd64.tar.gz"
        dest: /tmp/containerd.tar.gz
      when: not containerd_installed.stat.exists

    - name: Extract containerd to /usr/local
      unarchive:
        src: /tmp/containerd.tar.gz
        dest: /usr/local
        remote_src: yes
      when: not containerd_installed.stat.exists

    - name: Download containerd systemd service file
      get_url:
        url: https://raw.githubusercontent.com/containerd/containerd/main/containerd.service
        dest: /tmp/containerd.service

    - name: Create systemd directory for containerd
      file:
        path: /usr/local/lib/systemd/system
        state: directory

    - name: Install containerd service file
      copy:
        src: /tmp/containerd.service
        dest: /usr/local/lib/systemd/system/containerd.service
        remote_src: yes

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory

    - name: Generate default containerd configuration
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable SystemdCgroup in containerd (REQUIRED for kubeadm)
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start containerd service
      systemd:
        name: containerd
        enabled: yes
        state: restarted

    - name: Wait for containerd to be ready
      wait_for:
        timeout: 10
      delegate_to: localhost

    - name: Verify containerd is running
      systemd:
        name: containerd
        state: started
      register: containerd_status
      failed_when: containerd_status.status.ActiveState != "active"

    - name: Display containerd status
      debug:
        msg: "containerd is {{ containerd_status.status.ActiveState }}"

    # ============================================================
    # STEP 5: Install runc (OCI Runtime)
    # ============================================================
    - name: Check if runc is already installed
      stat:
        path: /usr/local/sbin/runc
      register: runc_installed

    - name: Download runc binary
      get_url:
        url: "https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.amd64"
        dest: /tmp/runc.amd64
        mode: '0755'
      when: not runc_installed.stat.exists

    - name: Install runc to system path
      copy:
        src: /tmp/runc.amd64
        dest: /usr/local/sbin/runc
        remote_src: yes
        mode: '0755'
      when: not runc_installed.stat.exists

    - name: Verify runc installation
      command: runc --version
      register: runc_version_output
      changed_when: false

    - name: Display runc version
      debug:
        msg: "{{ runc_version_output.stdout_lines }}"

    # ============================================================
    # STEP 6: Install CNI Plugins
    # ============================================================
    - name: Check if CNI plugins are already installed
      stat:
        path: /opt/cni/bin
      register: cni_installed

    - name: Download CNI plugins
      get_url:
        url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-amd64-v{{ cni_plugins_version }}.tgz"
        dest: /tmp/cni-plugins.tgz
      when: not cni_installed.stat.exists

    - name: Create CNI bin directory
      file:
        path: /opt/cni/bin
        state: directory

    - name: Extract CNI plugins
      unarchive:
        src: /tmp/cni-plugins.tgz
        dest: /opt/cni/bin
        remote_src: yes
      when: not cni_installed.stat.exists

    - name: List installed CNI plugins
      shell: ls -lh /opt/cni/bin/ | tail -5
      register: cni_plugins_list
      changed_when: false

    - name: Display CNI plugins
      debug:
        msg: "{{ cni_plugins_list.stdout_lines }}"

    # ============================================================
    # STEP 7: Install Kubernetes Components
    # ============================================================
    - name: Wait 3 seconds before apt operations
      pause:
        seconds: 3

    - name: Install required packages for Kubernetes repo (with timeout)
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: yes
      async: 300
      poll: 5

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Check if Kubernetes GPG key exists
      stat:
        path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      register: k8s_gpg_key

    - name: Add Kubernetes GPG key
      shell: curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      when: not k8s_gpg_key.stat.exists

    - name: Add Kubernetes APT repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /"
        mode: '0644'

    - name: Update apt cache after adding repo
      apt:
        update_cache: yes
      async: 300
      poll: 5

    - name: Install kubelet, kubeadm, and kubectl
      apt:
        name:
          - "kubelet={{ kubernetes_version }}"
          - "kubeadm={{ kubernetes_version }}"
          - "kubectl={{ kubernetes_version }}"
        state: present
        allow_downgrade: yes
      async: 300
      poll: 5

    - name: Hold Kubernetes packages at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Verify Kubernetes components installation
      shell: |
        kubeadm version
        kubectl version --client
        kubelet --version
      register: k8s_versions
      changed_when: false

    - name: Display Kubernetes versions
      debug:
        msg: "{{ k8s_versions.stdout_lines }}"

    # ============================================================
    # STEP 8: Configure CRI Runtime Endpoint
    # ============================================================
    - name: Configure crictl to use containerd socket
      shell: crictl config runtime-endpoint unix:///run/containerd/containerd.sock
      args:
        creates: /etc/crictl.yaml

    - name: Verify crictl configuration
      command: cat /etc/crictl.yaml
      register: crictl_config
      changed_when: false
      ignore_errors: yes

    - name: Display crictl configuration
      debug:
        msg: "{{ crictl_config.stdout_lines }}"
      when: crictl_config.rc == 0

    # ============================================================
    # STEP 9: Enable kubelet service
    # ============================================================
    - name: Enable kubelet service (will start after kubeadm init/join)
      systemd:
        name: kubelet
        enabled: yes

    - name: Display completion message
      debug:
        msg:
          - "=========================================="
          - "Common Prerequisites Installation Complete!"
          - "=========================================="
          - "Node: {{ inventory_hostname }}"
          - "Kubernetes Version: {{ kubernetes_version }}"
          - "Container Runtime: containerd {{ containerd_version }}"
          - "Status: Ready for kubeadm init/join"
          - "=========================================="
